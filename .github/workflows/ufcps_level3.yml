name: UFCPS Level 3

on:
  push:
    paths:
      - "swarm/**"
      - ".github/workflows/ufcps_level3.yml"

  pull_request:
    paths:
      - "swarm/**"
      - ".github/workflows/ufcps_level3.yml"

  workflow_dispatch:

jobs:
  level3-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: |
          python --version

      - name: Check repository environment
        run: |
          python swarm/environment_check_v1.py

      - name: Run Level 3 full-cycle benchmark
        run: |
          python swarm/level3_full_cycle_benchmark_v1.py

      - name: Run Level 3 recursive-space benchmark
        run: |
          python swarm/level3_recursive_space_benchmark_v1.py

      - name: Run Level 3 emergent integration
        run: |
          python swarm/level3_emergent_integration_v1.py

      - name: Run Level 3 system diagnostic
        run: |
          python swarm/level3_system_diagnostic_v1.py

      - name: Run L3 invariant discovery adapter
        run: |
          python swarm/experiments/L3-Invariant-Discovery-v1/invariant_discovery_adapter_v1.py

      - name: Run L3 invariant relation generator benchmark v2
        run: |
          python swarm/experiments/L3-Invariant-Discovery-v2/invariant_relation_generator_benchmark_v2.py
      - name: Run L3 invariant candidate evaluator v2
        run: |
          python swarm/experiments/L3-Invariant-Discovery-v2/invariant_candidate_evaluator_v2.py
